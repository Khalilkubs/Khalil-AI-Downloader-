name: Build Android APK
on:
  push:
    paths: ["mobile_app/**", ".github/workflows/build_android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zip unzip openjdk-17-jdk autoconf automake \
            libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev
      - run: pip install buildozer "cython==0.29.37" virtualenv
      - uses: actions/cache@v4
        with:
          path: |
            mobile_app/.buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('mobile_app/buildozer.spec') }}
      - name: Build debug APK
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: KhalilDownloader-Android-APK
          path: mobile_app/bin/*.apk
